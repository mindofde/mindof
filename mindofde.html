<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgilendirme Portalı</title>
    <!-- Tailwind CSS CDN (Hazır modern tasarım kütüphanesi) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <!-- Üst Menü -->
    <header class="w-full py-6 px-8 flex justify-between items-center max-w-5xl mx-auto">
        <div class="font-bold text-xl tracking-wider text-cyan-400">PROJE<span class="text-white">.INFO</span></div>
        <nav class="hidden md:flex gap-6 text-sm text-slate-400">
            <a href="#hakkinda" class="hover:text-cyan-400 transition">Hakkında</a>
            <a href="#iletisim" class="hover:text-cyan-400 transition">İletişim</a>
        </nav>
    </header>

    <!-- Ana İçerik (Tek Ekran Odaklı) -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="max-w-3xl text-center">
            
            <span class="inline-block py-1 px-3 rounded-full bg-cyan-500/10 text-cyan-400 text-xs font-semibold mb-6 border border-cyan-500/20">
                🚀 Yayında & Aktif
            </span>
            
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
                Yeni Nesil <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Bilgilendirme Platformu</span>
            </h1>
            
            <p class="text-slate-400 text-lg md:text-xl mb-10 leading-relaxed">
                Bu alan adı üzerinde yakında harika içerikler ve güncel duyurular yer alacak. Şimdilik hazırlık aşamasındayız!
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="mailto:eposta@ornekdomain.com" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-3 px-8 rounded-xl transition shadow-lg shadow-cyan-500/20">
                    Bize Ulaşın
                </a>
            </div>

        </div>
    </main>

    <!-- Alt Bilgi (Footer) -->
    <footer class="w-full py-6 text-center text-xs text-slate-600 border-t border-slate-900/50">
        &copy; 2026 Tüm hakları saklıdır. GitHub Pages ile barındırılmaktadır.
    </footer>

</body>
</html>
